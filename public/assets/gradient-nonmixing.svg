<svg xmlns="http://www.w3.org/2000/svg" width="400" height="235" viewBox="0 0 400 235" role="img" aria-labelledby="title desc"><title id="title">A. Non-mixing volume</title><desc id="desc">Liquid passes through tubing without mixing. A composition change is delayed but retains its shape.</desc><rect width="100%" height="100%" rx="12" fill="#f7f9fd"/><g font-family="Segoe UI,Arial,sans-serif" fill="#283451" font-size="17"><text x="20" y="32" font-weight="600">A. Non-mixing volume</text><text x="20" y="72">From pump</text><text x="295" y="200">To column</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657398"/></marker></defs><path d="M24 110H68" fill="none" stroke="#657398" stroke-width="2" marker-end="url(#arrow)"/><path d="M80 110H292Q306 110 306 124Q306 138 292 138H112Q98 138 98 152Q98 166 112 166H320" stroke="#657398" stroke-width="13" fill="none"/><path d="M80 110H292Q306 110 306 124Q306 138 292 138H112Q98 138 98 152Q98 166 112 166H320" stroke="#e4edf8" stroke-width="9" fill="none"/><path d="M150 110h40" stroke="#0072b2" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="210" text-anchor="middle" font-style="italic">V<tspan baseline-shift="sub" font-size="12">nonmix</tspan></text><path d="M330 166H374" stroke="#657398" stroke-width="2" marker-end="url(#arrow)"/></g></svg>