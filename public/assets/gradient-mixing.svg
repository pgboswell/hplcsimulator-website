<svg xmlns="http://www.w3.org/2000/svg" width="400" height="235" viewBox="0 0 400 235" role="img" aria-labelledby="title desc"><title id="title">B. Mixing volume</title><desc id="desc">Liquid entering a stirred chamber mixes with the liquid already inside. Composition changes become delayed and rounded.</desc><rect width="100%" height="100%" rx="12" fill="#f7f9fd"/><g font-family="Segoe UI,Arial,sans-serif" fill="#283451" font-size="17"><text x="20" y="32" font-weight="600">B. Mixing volume</text><text x="20" y="72">From pump</text><text x="295" y="200">To column</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657398"/></marker></defs><path d="M24 130H68" fill="none" stroke="#657398" stroke-width="2" marker-end="url(#arrow)"/><path d="M80 130H158M242 130H320" stroke="#657398" stroke-width="13"/><path d="M80 130H160M240 130H320" stroke="#dce9f7" stroke-width="9"/><circle cx="200" cy="130" r="43" fill="#dce9f7" stroke="#657398" stroke-width="2"/><path d="M222 130a22 22 0 1 1-22-22" fill="none" stroke="#0072b2" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="200" cy="130" r="4" fill="#283451"/><text x="200" y="210" text-anchor="middle" font-style="italic">V<tspan baseline-shift="sub" font-size="12">mix</tspan></text><path d="M330 130H374" stroke="#657398" stroke-width="2" marker-end="url(#arrow)"/></g></svg>